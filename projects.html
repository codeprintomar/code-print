<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاريع — CodePrint</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){try{if(localStorage.getItem('codeprint-theme')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();</script>

<body class="has-notch-nav">
<svg class="hidden" style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
  <defs>
    <filter id="codeprint-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="glow-orb one"></div>
<div class="glow-orb two"></div>

<div class="notch-nav">
  <div class="notch-pill">
    <a href="index.html" class="notch-logo">
      <span class="logo-mark">&lt;/&gt;</span>
      CodePrint
    </a>
    <div class="notch-links">
      <a href="index.html">الرئيسية</a>
      <a href="projects.html" class="active">المشاريع</a>
      <a href="links.html">الروابط</a>
      <a href="index.html#contact">تواصل</a>
    </div>
    <button class="notch-toggle" aria-haspopup="true" aria-expanded="false" aria-label="فتح القائمة">
      <span>المشاريع</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <button class="theme-toggle" aria-label="تبديل الوضع الليلي/النهاري" title="تبديل الوضع">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
  <div class="notch-drawer">
    <a href="index.html">الرئيسية</a>
    <a href="projects.html" class="active">المشاريع</a>
    <a href="links.html">الروابط</a>
    <a href="index.html#contact">تواصل</a>
  </div>
</div>

<header class="page-hero">
  <div class="container">
    <span class="eyebrow"><span class="dot"></span> Projects</span>
    <h1>كل المشاريع</h1>
    <p>كل حاجة بنبنيها في CodePrint، من الألعاب لحد أدوات الـ AI — واضح فيها إيه اللي جاهز وإيه لسه جاي.</p>
  </div>
</header>

<section class="section">
  <div class="container">

    <!-- تابات الفلترة تتولد تلقائيًا من projects-data.js -->
    <div class="filter-tabs" id="filter-tabs"></div>

    <!-- الكاردز تتولد تلقائيًا من projects-data.js. عدّل هناك عشان تضيف مشروع جديد. -->
    <div class="grid grid-3" id="projects-container"></div>

  </div>
</section>
