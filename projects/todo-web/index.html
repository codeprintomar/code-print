<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام اليومية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .login-container {
            max-width: 600px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 60px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-title {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 20px;
        }

        .login-subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .login-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .login-tab {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: #f0f0f0;
            color: #666;
        }

        .login-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 20px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            font-size: 18px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .user-details {
            text-align: right;
        }

        .user-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .user-email {
            font-size: 16px;
            color: #666;
        }

        .btn-logout {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 40px;
            font-size: 3.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .top-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 18px;
            color: #666;
            margin-top: 10px;
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .filter-buttons {
            display: flex;
            gap: 15px;
        }

        .filter-btn {
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #667eea;
            border: 3px solid #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .filter-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .search-box {
            display: flex;
            gap: 15px;
        }

        .search-input {
            flex: 1;
            padding: 20px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            font-size: 20px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.1);
        }

        .btn-clear {
            padding: 20px 30px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .add-task-section {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 20px;
            margin-bottom: 40px;
            animation: slideDown 0.5s ease;
        }

        .task-input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            padding: 20px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            font-size: 20px;
            transition: all 0.3s;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.1);
        }

        .date-priority-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="date"], select {
            padding: 20px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select {
            background: white;
        }

        .btn {
            padding: 20px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-add:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .date-group {
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }

        .date-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .date-header:hover {
            transform: translateX(-10px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .date-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            font-weight: bold;
        }

        .task-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 18px;
        }

        .progress-bar {
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s;
        }

        .tasks-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .tasks-list.expanded {
            max-height: 5000px;
        }

        .task-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto auto;
            align-items: center;
            gap: 20px;
            padding: 25px;
            background: white;
            border: 3px solid #f0f0f0;
            border-radius: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        .task-item:hover {
            border-color: #667eea;
            transform: translateX(-10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .task-item.priority-high {
            border-right: 8px solid #ff4757;
        }

        .task-item.priority-medium {
            border-right: 8px solid #ffa502;
        }

        .task-item.priority-low {
            border-right: 8px solid #2ed573;
        }

        .checkbox {
            width: 40px;
            height: 40px;
            border: 3px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .checkbox.checked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .checkbox.checked::after {
            content: '✔';
            color: white;
            font-size: 24px;
            animation: checkmark 0.3s ease;
        }

        .task-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-text {
            font-size: 20px;
            color: #333;
            transition: all 0.3s;
            font-weight: 500;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #999;
        }

        .task-notes {
            font-size: 16px;
            color: #666;
            font-style: italic;
        }

        .priority-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        .priority-high {
            background: #ff4757;
            color: white;
        }

        .priority-medium {
            background: #ffa502;
            color: white;
        }

        .priority-low {
            background: #2ed573;
            color: white;
        }

        .task-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .btn-edit {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-delete {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-icon:hover {
            transform: scale(1.15);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-icon:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 80px;
            color: #999;
            font-size: 24px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 30px;
            max-width: 800px;
            width: 90%;
            animation: slideDown 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 32px;
            color: #667eea;
            font-weight: bold;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 36px;
            cursor: pointer;
            color: #999;
            transition: all 0.3s;
        }

        .btn-close:hover {
            color: #f5576c;
            transform: rotate(90deg);
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 20px;
        }

        .error-message {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes checkmark {
            from {
                transform: scale(0) rotate(0deg);
            }
            to {
                transform: scale(1) rotate(360deg);
            }
        }

        .chevron {
            transition: transform 0.3s;
            font-size: 24px;
        }

        .chevron.rotated {
            transform: rotate(180deg);
        }

        @media (max-width: 1200px) {
            .top-section {
                grid-template-columns: 1fr;
            }
            
            .add-task-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginPage">
        <div class="login-title">📋 قائمة المهام الذكية</div>
        <div class="login-subtitle">سجل دخول أو أنشئ حساب جديد</div>
        
        <div class="login-tabs">
            <button class="login-tab active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="login-tab" onclick="switchTab('register')">إنشاء حساب</button>
        </div>

        <div class="login-form active" id="loginForm">
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" class="form-input" id="loginEmail" required placeholder="example@email.com" />
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-input" id="loginPassword" required placeholder="••••••••" />
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">🔓 دخول</button>
            </form>
        </div>

        <div class="login-form" id="registerForm">
            <form onsubmit="register(event)">
                <div class="form-group">
                    <label class="form-label">الاسم الكامل</label>
                    <input type="text" class="form-input" id="registerName" required placeholder="أدخل اسمك" />
                </div>
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" class="form-input" id="registerEmail" required placeholder="example@email.com" />
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-input" id="registerPassword" required placeholder="••••••••" minlength="6" />
                </div>
                <button type="submit" class="btn-submit" id="registerBtn">✨ إنشاء حساب</button>
            </form>
        </div>
    </div>

    <div class="container hidden" id="mainApp">
        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div class="user-details">
                    <div class="user-name" id="userName">أحمد محمد</div>
                    <div class="user-email" id="userEmail">ahmed@example.com</div>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">🚪 تسجيل الخروج</button>
        </div>

        <h1>📋 مهامي اليومية</h1>
        
        <div class="top-section">
            <div class="stats">
                <div class="stat-card" onclick="filterTasks('all')">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">📝 إجمالي المهام</div>
                </div>
                <div class="stat-card" onclick="filterTasks('completed')">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">✅ المهام المكتملة</div>
                </div>
                <div class="stat-card" onclick="filterTasks('pending')">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">⏳ المهام المتبقية</div>
                </div>
            </div>

            <div class="filters">
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterTasks('all')" id="filter-all">الكل</button>
                    <button class="filter-btn" onclick="filterTasks('completed')" id="filter-completed">المكتملة</button>
                    <button class="filter-btn" onclick="filterTasks('pending')" id="filter-pending">المتبقية</button>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث عن مهمة..." oninput="searchTasks()" />
                    <input type="date" class="search-input" id="searchDateInput" onchange="searchTasks()" style="flex: 0.5;" />
                    <button class="btn-clear" onclick="clearAllCompleted()">🗑️ حذف المكتملة</button>
                </div>
            </div>
        </div>

        <div class="add-task-section">
            <div class="task-input-group">
                <input type="text" id="taskInput" placeholder="✏️ عنوان المهمة..." />
                <textarea id="taskNotes" placeholder="📝 ملاحظات إضافية (اختياري)..." rows="2"></textarea>
            </div>
            <div class="date-priority-group">
                <input type="date" id="dateInput" />
                <select id="prioritySelect">
                    <option value="low">🟢 أولوية منخفضة</option>
                    <option value="medium" selected>🟡 أولوية متوسطة</option>
                    <option value="high">🔴 أولوية عالية</option>
                </select>
            </div>
            <button class="btn btn-add" onclick="addTask()" id="addTaskBtn">
                <span>➕</span>
                <span>إضافة</span>
            </button>
        </div>

        <div id="tasksContainer"></div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">✏️ تعديل المهمة</div>
                <button class="btn-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="task-input-group">
                <input type="text" id="editTaskInput" placeholder="عنوان المهمة..." />
                <textarea id="editTaskNotes" placeholder="ملاحظات إضافية..." rows="3"></textarea>
            </div>
            <div class="date-priority-group" style="margin-top: 20px;">
                <input type="date" id="editDateInput" />
                <select id="editPrioritySelect">
                    <option value="low">🟢 أولوية منخفضة</option>
                    <option value="medium">🟡 أولوية متوسطة</option>
                    <option value="high">🔴 أولوية عالية</option>
                </select>
            </div>
            <button class="btn btn-add" onclick="saveEditTask()" id="saveEditBtn" style="width: 100%; margin-top: 30px;">
                💾 حفظ التعديلات
            </button>
        </div>
    </div>

    <script>
        const API_BASE = '/.netlify/functions';
        let currentUser = null;
        let tasksDatabase = [];
        let currentFilter = 'all';
        let currentEditId = null;
        let isLoading = false;

        window.onload = async function() {
            await checkLogin();
            
            document.getElementById('taskInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
        };

     async function apiCall(endpoint, method = 'GET', data = null) {
  const options = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (data) options.body = JSON.stringify(data);

  const response = await fetch(`${API_BASE}${endpoint}`, options);
  const text = await response.text();

  try {
    const json = JSON.parse(text);
    if (!response.ok) throw new Error(json.error || json.message || 'حدث خطأ');
    return json;
  } catch {
    throw new Error('الوظيفة غير موجودة أو لا تعمل. تأكد من اسم الملف داخل netlify/functions.');
  }
}

        function switchTab(tab) {
            const loginTab = document.querySelector('.login-tabs .login-tab:first-child');
            const registerTab = document.querySelector('.login-tabs .login-tab:last-child');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
            }
        }

        async function register(e) {
            e.preventDefault();
            
            if (isLoading) return;
            isLoading = true;
            
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري التسجيل...';
            
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim().toLowerCase();
            const password = document.getElementById('registerPassword').value;

          try {
  await apiCall('/.netlify/functions/auth-register', 'POST', { name, email, password });

  alert('✅ تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن');
  switchTab('login');

  document.getElementById('registerName').value = '';
  document.getElementById('registerEmail').value = '';
  document.getElementById('registerPassword').value = '';
} catch (error) {
  alert('❌ ' + error.message);
}

            btn.disabled = false;
            btn.textContent = '✨ إنشاء حساب';
            isLoading = false;
        }

        async function login(e) {
            e.preventDefault();
            
            if (isLoading) return;
            isLoading = true;
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري تسجيل الدخول...';
            
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            try {
                const result = await apiCall('/auth-login', 'POST', { email, password });
                
                currentUser = result.user;
                sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                await loadUserTasks();
                showMainApp();
            } catch (error) {
                alert('❌ ' + error.message);
            }
            
            btn.disabled = false;
            btn.textContent = '🔓 دخول';
            isLoading = false;
        }

        async function logout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                currentUser = null;
                tasksDatabase = [];
                sessionStorage.removeItem('currentUser');
                
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('loginPage').classList.remove('hidden');
            }
        }

        async function checkLogin() {
            const savedUser = sessionStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                await loadUserTasks();
                showMainApp();
            }
        }

        async function loadUserTasks() {
            try {
                const result = await apiCall(`/tasks?email=${currentUser.email}`);
                tasksDatabase = result.tasks || [];
            } catch (error) {
                console.error('Load tasks error:', error);
                tasksDatabase = [];
            }
        }

        function showMainApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
            
            document.getElementById('dateInput').valueAsDate = new Date();
            renderTasks();
        }

        async function addTask() {
            if (isLoading) return;
            
            const taskInput = document.getElementById('taskInput');
            const taskNotes = document.getElementById('taskNotes');
            const dateInput = document.getElementById('dateInput');
            const prioritySelect = document.getElementById('prioritySelect');
            const btn = document.getElementById('addTaskBtn');
            
            const taskText = taskInput.value.trim();
            const notes = taskNotes.value.trim();
            const taskDate = dateInput.value;
            const priority = prioritySelect.value;

            if (!taskText || !taskDate) {
                alert('⚠️ الرجاء إدخال عنوان المهمة واختيار التاريخ');
                return;
            }

            isLoading = true;
            btn.disabled = true;
            btn.innerHTML = '<span>⏳</span><span>جاري الإضافة...</span>';

            try {
                const result = await apiCall('/tasks', 'POST', {
                    user_email: currentUser.email,
                    text: taskText,
                    notes: notes,
                    date: taskDate,
                    priority: priority
                });

                tasksDatabase.push(result.task);
                taskInput.value = '';
                taskNotes.value = '';
                renderTasks();
            } catch (error) {
                alert('❌ ' + error.message);
            }

            btn.disabled = false;
            btn.innerHTML = '<span>➕</span><span>إضافة</span>';
            isLoading = false;
        }

        async function toggleTask(id) {
            if (isLoading) return;
            
            const task = tasksDatabase.find(t => t.id === id);
            if (!task) return;

            isLoading = true;

            try {
                const result = await apiCall(`/tasks/${id}`, 'PUT', {
                    completed: !task.completed
                });

                task.completed = result.task.completed;
                renderTasks();
            } catch (error) {
                alert('❌ ' + error.message);
            }

            isLoading = false;
        }

        async function deleteTask(id) {
            if (!confirm('هل أنت متأكد من حذف هذه المهمة؟')) return;
            if (isLoading) return;

            isLoading = true;

            try {
                await apiCall(`/tasks/${id}`, 'DELETE');
                tasksDatabase = tasksDatabase.filter(t => t.id !== id);
                renderTasks();
            } catch (error) {
                alert('❌ ' + error.message);
            }

            isLoading = false;
        }

        function editTask(id) {
            const task = tasksDatabase.find(t => t.id === id);
            if (task) {
                currentEditId = id;
                document.getElementById('editTaskInput').value = task.text;
                document.getElementById('editTaskNotes').value = task.notes || '';
                document.getElementById('editDateInput').value = task.date;
                document.getElementById('editPrioritySelect').value = task.priority;
                document.getElementById('editModal').classList.add('active');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditId = null;
        }

        async function saveEditTask() {
            if (isLoading) return;
            
            const task = tasksDatabase.find(t => t.id === currentEditId);
            if (!task) return;

            const btn = document.getElementById('saveEditBtn');
            const newText = document.getElementById('editTaskInput').value.trim();
            const newNotes = document.getElementById('editTaskNotes').value.trim();
            const newDate = document.getElementById('editDateInput').value;
            const newPriority = document.getElementById('editPrioritySelect').value;

            if (!newText || !newDate) {
                alert('⚠️ الرجاء إدخال عنوان المهمة واختيار التاريخ');
                return;
            }

            isLoading = true;
            btn.disabled = true;
            btn.textContent = '⏳ جاري الحفظ...';

            try {
                const result = await apiCall(`/tasks/${currentEditId}`, 'PUT', {
                    text: newText,
                    notes: newNotes,
                    date: newDate,
                    priority: newPriority
                });

                Object.assign(task, result.task);
                renderTasks();
                closeEditModal();
            } catch (error) {
                alert('❌ ' + error.message);
            }

            btn.disabled = false;
            btn.textContent = '💾 حفظ التعديلات';
            isLoading = false;
        }

        async function clearAllCompleted() {
            const completedTasks = tasksDatabase.filter(t => t.completed);
            if (completedTasks.length === 0) {
                alert('ℹ️ لا توجد مهام مكتملة لحذفها');
                return;
            }
            
            if (!confirm(`هل تريد حذف ${completedTasks.length} مهمة مكتملة؟`)) return;
            if (isLoading) return;

            isLoading = true;

            try {
                await apiCall('/tasks/clear-completed', 'POST', {
                    user_email: currentUser.email
                });

                tasksDatabase = tasksDatabase.filter(t => !t.completed);
                renderTasks();
            } catch (error) {
                alert('❌ ' + error.message);
            }

            isLoading = false;
        }

        function searchTasks() {
            const searchDate = document.getElementById('searchDateInput').value;
            if (searchDate) {
                setTimeout(() => {
                    const tasksList = document.getElementById(`tasks-${searchDate}`);
                    const chevron = document.getElementById(`chevron-${searchDate}`);
                    if (tasksList && !tasksList.classList.contains('expanded')) {
                        tasksList.classList.add('expanded');
                        chevron.classList.add('rotated');
                    }
                }, 100);
            }
            renderTasks();
        }

        function filterTasks(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`filter-${filter}`).classList.add('active');
            
            renderTasks();
        }

        function toggleDate(date) {
            const tasksList = document.getElementById(`tasks-${date}`);
            const chevron = document.getElementById(`chevron-${date}`);
            
            if (tasksList.classList.contains('expanded')) {
                tasksList.classList.remove('expanded');
                chevron.classList.remove('rotated');
            } else {
                tasksList.classList.add('expanded');
                chevron.classList.add('rotated');
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const taskDate = new Date(dateStr + 'T00:00:00');
            taskDate.setHours(0, 0, 0, 0);

            if (taskDate.getTime() === today.getTime()) {
                return '📅 اليوم';
            } else if (taskDate.getTime() === yesterday.getTime()) {
                return '📅 أمس';
            } else if (taskDate.getTime() === tomorrow.getTime()) {
                return '📅 غداً';
            } else {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return '📅 ' + date.toLocaleDateString('ar-EG', options);
            }
        }

        function updateStats() {
            const total = tasksDatabase.length;
            const completed = tasksDatabase.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('pendingTasks').textContent = pending;
        }

        function getPriorityText(priority) {
            const priorities = {
                high: '🔴 عالية',
                medium: '🟡 متوسطة',
                low: '🟢 منخفضة'
            };
            return priorities[priority];
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredTasks = tasksDatabase;
            
            if (currentFilter === 'completed') {
                filteredTasks = filteredTasks.filter(t => t.completed);
            } else if (currentFilter === 'pending') {
                filteredTasks = filteredTasks.filter(t => !t.completed);
            }
            
            if (searchTerm) {
                filteredTasks = filteredTasks.filter(t => 
                    t.text.toLowerCase().includes(searchTerm) || 
                    (t.notes && t.notes.toLowerCase().includes(searchTerm))
                );
            }

            const searchDate = document.getElementById('searchDateInput').value;
            if (searchDate) {
                filteredTasks = filteredTasks.filter(t => t.date === searchDate);
            }
            
            if (filteredTasks.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد مهام حتى الآن. أضف مهمة جديدة! 🎯</div>';
                updateStats();
                return;
            }

            const tasksByDate = {};
            filteredTasks.forEach(task => {
                if (!tasksByDate[task.date]) {
                    tasksByDate[task.date] = [];
                }
                tasksByDate[task.date].push(task);
            });

            const sortedDates = Object.keys(tasksByDate).sort((a, b) => new Date(b) - new Date(a));

            let html = '';
            sortedDates.forEach(date => {
                const tasks = tasksByDate[date];
                const completedCount = tasks.filter(t => t.completed).length;
                const progress = (completedCount / tasks.length) * 100;
                
                html += `
                    <div class="date-group">
                        <div class="date-header" onclick="toggleDate('${date}')">
                            <div class="date-title">
                                <span>${formatDate(date)}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 20px;">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress}%"></div>
                                </div>
                                <span class="task-count">${completedCount}/${tasks.length}</span>
                                <span class="chevron rotated" id="chevron-${date}">▼</span>
                            </div>
                        </div>
                        <div class="tasks-list expanded" id="tasks-${date}">
                `;

                tasks.sort((a, b) => {
                    const priorityOrder = { high: 0, medium: 1, low: 2 };
                    return priorityOrder[a.priority] - priorityOrder[b.priority];
                });

                tasks.forEach(task => {
                    html += `
                        <div class="task-item priority-${task.priority}">
                            <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
                            <div class="task-content">
                                <div class="task-text ${task.completed ? 'completed' : ''}">${task.text}</div>
                                ${task.notes ? `<div class="task-notes">${task.notes}</div>` : ''}
                            </div>
                            <div class="priority-badge priority-${task.priority}">
                                ${getPriorityText(task.priority)}
                            </div>
                            <div class="task-buttons">
                                <button class="btn-icon btn-edit" onclick="editTask(${task.id})" title="تعديل" ${isLoading ? 'disabled' : ''}>✏️</button>
                                <button class="btn-icon btn-delete" onclick="deleteTask(${task.id})" title="حذف" ${isLoading ? 'disabled' : ''}>🗑️</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateStats();
        }
    </script>
</body>
</html>
