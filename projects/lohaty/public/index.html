.btns button{font-size:14px;min-height:40px;padding:6px 14px}

.wrap{border:0;background:var(--card);border-radius:var(--r)}

<script>
(()=>{
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

const pad=n=>String(n).padStart(2,"0");

function openDate(input,btn){

function buildReminders(days=14){const out=[],now=Date.now(),t0=fmt(new Date()),at=(ds,hm)=>new Date(ds+"T"+hm+":00").getTime();
  for(let i=0;i<=days;i++){const ds=addDays(t0,i);occ(ds).forEach(e=>{if(!e.rem)return;const a=at(ds,e.start)-e.rem*6e4;if(a>now)out.push({id:"e_"+e.id+"_"+ds,at:a,title:T[e.type][1]+" "+e.title,body:"بعد "+e.rem+" دقيقة — "+ft(e.start)+(e.place?" · "+e.place:"")})})}
  S.tasks.forEach(t=>{if(!t.due||t.st==="تم التسليم")return;const nm=subName(t.subjectId);[[t.due,"08:00","📌 النهارده تسليم: "],[addDays(t.due,-1),"18:00","⏳ بكرة تسليم: "]].forEach(([d,h,p],j)=>{const a=at(d,h);if(a>now&&a<now+days*864e5)out.push({id:"t_"+t.id+"_"+j,at:a,title:p+t.title,body:nm})})});
  S.lec.forEach(l=>{if(l.w||!l.rel)return;const a=at(l.rel,"09:00");if(a>now&&a<now+days*864e5)out.push({id:"l_"+l.id,at:a,title:"🎬 نزلت: "+l.title,body:subName(l.subjectId)})});
  return out.sort((a,b)=>a.at-b.at).slice(0,400)}
